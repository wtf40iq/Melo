name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Версия
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          else { $tag = "v" + (Get-Content package.json -Raw | ConvertFrom-Json).version }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Сборка
        run: npx tauri build --no-bundle

      - name: Упаковка
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/melo.exe out/Melo.exe
          Compress-Archive -Path out/Melo.exe -DestinationPath "out/Melo-windows-${{ steps.ver.outputs.tag }}.zip"

      - name: Релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Melo ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            out/Melo.exe
            out/Melo-windows-${{ steps.ver.outputs.tag }}.zip
