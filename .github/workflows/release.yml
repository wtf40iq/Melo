name: Release

# Релиз создаётся сам, когда на main меняется версия в package.json
# (или по тегу v*, или вручную: Actions → Release → Run workflow).
on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          else { $tag = "v" + (Get-Content package.json -Raw | ConvertFrom-Json).version }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $skip = "false"
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -ne "tag") {
            gh release view $tag --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -eq 0) { $skip = "true" }
          }
          "skip=$skip" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.skip != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          workspaces: src-tauri

      - run: npm ci
        if: steps.ver.outputs.skip != 'true'

      - name: Проверка типов
        if: steps.ver.outputs.skip != 'true'
        run: npm run typecheck

      - name: Тесты Rust
        if: steps.ver.outputs.skip != 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Сборка
        if: steps.ver.outputs.skip != 'true'
        run: npx tauri build --bundles nsis

      - name: Упаковка
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/melo.exe out/Melo.exe
          Compress-Archive -Path out/Melo.exe -DestinationPath "out/Melo-windows-$tag.zip"
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "out/Melo-setup-$tag.exe"
          # Контрольная сумма: автообновление без неё не устанавливает файл
          $hash = (Get-FileHash out/Melo.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Melo.exe" | Out-File -FilePath out/Melo.exe.sha256 -Encoding ascii -NoNewline

      - name: Заметки к релизу из CHANGELOG
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $ver = $tag.TrimStart("v")
          $all = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s+" + [regex]::Escape($ver) + "\s*\r?\n(.*?)(?=^##\s+|\z)"
          $m = [regex]::Match($all, $pattern)
          if (-not $m.Success) { throw "В CHANGELOG.md нет раздела $ver" }
          $body = $m.Groups[1].Value.Trim()
          $body | Out-File -FilePath out/release-notes.md -Encoding utf8

      - name: Релиз на GitHub
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Melo ${{ steps.ver.outputs.tag }}
          make_latest: true
          # Текст берём из CHANGELOG.md, а не из случайных сообщений коммитов
          body_path: out/release-notes.md
          files: |
            out/Melo.exe
            out/Melo.exe.sha256
            out/Melo-windows-${{ steps.ver.outputs.tag }}.zip
            out/Melo-setup-${{ steps.ver.outputs.tag }}.exe
